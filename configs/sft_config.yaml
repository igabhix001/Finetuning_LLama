# SFT Training Configuration for RTX 6000 Ada (48GB VRAM)
# Supervised Fine-Tuning with LoRA (on top of DAPT LoRA)

# Model paths
model_name: "meta-llama/Llama-3.1-8B-Instruct"  # Base model
dapt_lora_path: "./checkpoints/dapt_lora/final/"  # DAPT LoRA adapters
output_dir: "./checkpoints/sft_lora/"
logging_dir: "./logs/sft/"

# Dataset
# Use new consultation dataset (19_generate_sft_consultation.py output)
# Falls back to old dataset if new one not yet generated
train_data: "./data/sft_consultation/final"
eval_data: "./data/sft_validation/"
# Legacy fallback: "./data/sft_train/"

# Training hyperparameters
num_train_epochs: 3
per_device_train_batch_size: 1  # Keep at 1 - batch_size=2 causes OOM with 4096 seq length
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16  # Effective batch size: 16
learning_rate: 2.0e-4
warmup_ratio: 0.03
weight_decay: 0.01

# Logging and checkpointing
logging_steps: 10
eval_steps: 250  # Reduced eval frequency: 100→250 (saves ~30min total)
save_steps: 500
save_total_limit: 3
evaluation_strategy: "steps"
load_best_model_at_end: true
metric_for_best_model: "eval_loss"
greater_is_better: false

# Optimization for RTX 6000 Ada
fp16: false
bf16: true  # Ada GPUs have native bf16 support
gradient_checkpointing: true
optim: "paged_adamw_8bit"  # 8-bit optimizer to save ~8GB VRAM
lr_scheduler_type: "cosine"
max_grad_norm: 1.0

# Context and tokenization
# CRITICAL FIX: chart YAML is ~3500 tokens. 1024 was too short — model never
# saw the full chart during SFT training. Now set to 4096 to include full chart.
max_seq_length: 4096  # Fits in 48GB with LoRA + 8bit optimizer + gradient checkpointing
dataloader_num_workers: 4
dataloader_pin_memory: true

# Memory optimization
gradient_checkpointing_kwargs:
  use_reentrant: false

# Early stopping
early_stopping_patience: 3
early_stopping_threshold: 0.001

# Reporting
report_to: "tensorboard"
