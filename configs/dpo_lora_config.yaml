# LoRA Configuration for DPO (Stage 3)
# Optimized for RTX 6000 Ada (48GB VRAM)
# Applied on top of merged DAPT+SFT model (NEVER stacked on existing LoRA)

# LoRA parameters — slightly lower rank than SFT since DPO is a refinement step
r: 8  # Rank — lower than SFT (16) since DPO is fine-grained preference tuning
lora_alpha: 8  # Scaling factor (1:1 with rank — conservative for DPO)
lora_dropout: 0.05

# Target modules for Llama 3.1
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# LoRA settings
bias: "none"
task_type: "CAUSAL_LM"
inference_mode: false

# Memory optimization
modules_to_save: null
