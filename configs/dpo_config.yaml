# DPO Training Configuration for RTX 6000 Ada (48GB VRAM)
# Stage 3: Preference Optimization (on top of merged DAPT+SFT model)

# Model paths
model_name: "./models/merged_sft/"  # Merged DAPT+SFT model (from 05b_merge_sft_lora.py)
output_dir: "./checkpoints/dpo_lora/"
logging_dir: "./logs/dpo/"

# Dataset
train_data: "./data/dpo/prepared/train_filtered"
eval_data: "./data/dpo/prepared/test_filtered"

# DPO hyperparameters
beta: 0.1  # Conservative beta to prevent reward hacking (was 0.2)
loss_type: "sigmoid"  # Standard DPO loss
label_smoothing: 0.05  # cDPO: handle noisy synthetic preferences

# Training hyperparameters
num_train_epochs: 3
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16  # Effective batch size: 16
learning_rate: 5.0e-6  # Conservative LR to prevent reward hacking (was 1e-5)
warmup_ratio: 0.1  # Shorter warmup
weight_decay: 0.01  # Lighter regularization

# Early stopping
early_stopping_patience: 3  # More patience for convergence

# Logging and checkpointing
logging_steps: 10
eval_steps: 50   # Less frequent eval to allow learning
save_steps: 50
save_total_limit: 3
evaluation_strategy: "steps"
load_best_model_at_end: true
metric_for_best_model: "eval_loss"
greater_is_better: false

# Optimization for RTX 6000 Ada
fp16: false
bf16: true
gradient_checkpointing: true
optim: "paged_adamw_8bit"
lr_scheduler_type: "cosine"
max_grad_norm: 1.0  # Allow larger gradients

# Context and tokenization
max_length: 1024  # Reduced to minimize noisy summed logprobs
max_prompt_length: 768  # Reduced proportionally

# Memory optimization
gradient_checkpointing_kwargs:
  use_reentrant: false

# Reporting
report_to: "tensorboard"
