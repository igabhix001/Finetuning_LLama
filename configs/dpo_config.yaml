# DPO Training Configuration for RTX 6000 Ada (48GB VRAM)
# Stage 3: Preference Optimization (on top of merged DAPT+SFT model)

# Model paths
model_name: "./models/merged_sft/"  # Merged DAPT+SFT model (from 05b_merge_sft_lora.py)
output_dir: "./checkpoints/dpo_lora/"
logging_dir: "./logs/dpo/"

# Dataset
train_data: "./data/dpo/prepared/train"
eval_data: "./data/dpo/prepared/test"

# DPO hyperparameters
beta: 0.5  # Strong KL constraint — prevents reward hacking on small dataset
loss_type: "sigmoid"  # Standard DPO loss
label_smoothing: 0.1  # cDPO: assume 10% label noise to prevent reward hacking

# Training hyperparameters
num_train_epochs: 3  # More epochs; early stopping will halt when eval_loss plateaus
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16  # Effective batch size: 16 (smoother gradients)
learning_rate: 2.0e-6  # Conservative: 3e-6 still overfit by epoch 0.6
warmup_ratio: 0.15
weight_decay: 0.05  # Stronger regularization

# Early stopping
early_stopping_patience: 2  # Stop quickly if eval_loss doesn't improve for 2 evals

# Logging and checkpointing
logging_steps: 5
eval_steps: 10   # Eval very frequently to catch the sweet spot
save_steps: 10   # Save at every eval to preserve best checkpoint
save_total_limit: 3
evaluation_strategy: "steps"
load_best_model_at_end: true
metric_for_best_model: "eval_loss"
greater_is_better: false

# Optimization for RTX 6000 Ada
fp16: false
bf16: true
gradient_checkpointing: true
optim: "paged_adamw_8bit"
lr_scheduler_type: "cosine"
max_grad_norm: 0.3  # Tighter clipping

# Context and tokenization
max_length: 1024  # Max combined length (prompt + chosen/rejected)
max_prompt_length: 512  # Max prompt length

# Memory optimization
gradient_checkpointing_kwargs:
  use_reentrant: false

# Reporting
report_to: "tensorboard"
