# DPO Training Configuration for RTX 6000 Ada (48GB VRAM)
# Stage 3: Preference Optimization (on top of merged DAPT+SFT model)

# Model paths
model_name: "./models/merged_sft/"  # Merged DAPT+SFT model (from 05b_merge_sft_lora.py)
output_dir: "./checkpoints/dpo_lora/"
logging_dir: "./logs/dpo/"

# Dataset
train_data: "./data/dpo/prepared/train"
eval_data: "./data/dpo/prepared/test"

# DPO hyperparameters
beta: 0.4  # Stronger KL constraint to prevent margin blow-up
loss_type: "sigmoid"  # Standard DPO loss

# Training hyperparameters
num_train_epochs: 1  # keep 1 epoch
max_steps: 80        # early stop (112 total steps -> cap at 80 to avoid late-epoch collapse)
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8  # Effective batch size: 8
learning_rate: 1.0e-6  # Further reduced LR to avoid overfitting
warmup_ratio: 0.2
weight_decay: 0.01

# Logging and checkpointing
logging_steps: 10
eval_steps: 50
save_steps: 100
save_total_limit: 3
evaluation_strategy: "steps"
load_best_model_at_end: true
metric_for_best_model: "eval_loss"
greater_is_better: false

# Optimization for RTX 6000 Ada
fp16: false
bf16: true
gradient_checkpointing: true
optim: "paged_adamw_8bit"
lr_scheduler_type: "cosine"
max_grad_norm: 0.25  # Stronger clipping

# Context and tokenization
max_length: 1024  # Max combined length (prompt + chosen/rejected)
max_prompt_length: 512  # Max prompt length

# Memory optimization
gradient_checkpointing_kwargs:
  use_reentrant: false

# Reporting
report_to: "tensorboard"
